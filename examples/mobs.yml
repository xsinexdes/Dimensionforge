# Ejemplo: Guardián Minero, jefe de 3 fases (100% → 66% → 33%).
# Sin BetterModel funciona igual (mob vainilla); con BetterModel y model.name = guardian_minero usa el modelo.
mobs:
  guardian_minero:
    dimension: minas
    enabled: true
    name: "<gold><bold>Guardián Minero"
    type: IRON_GOLEM
    stats:
      health: 400.0
      damage: 14.0
      speed: 0.25
      armor: 6.0
      toughness: 2.0
      knockback-resistance: 0.8
      follow-range: 40.0
      scale: 1.0
      regen-per-second: 0.0
    behavior:
      name-visible: true
      glowing: false
      silent-vanilla: true
      fire-immune: true
    model:
      name: guardian_minero
      scale: 1.0
      anim:
        idle: idle
        walk: walk
        attack: attack
        hurt: hurt
        death: death
        spawn: ""
    drops:
      items:
        0:
          material: PAPER
          min: 4
          max: 8
          cmd: 100000
          name: "<aqua><bold>Mithril"
          lore: []
          chance: 100.0
        1:
          material: NETHERITE_SCRAP
          min: 1
          max: 2
          cmd: 0
          name: ""
          lore: []
          chance: 50.0
      replace-vanilla: true
      xp-min: 200
      xp-max: 300
    fx:
      ambient-sound: entity.iron_golem.step
      ambient-interval: 8
      hurt-sound: entity.iron_golem.hurt
      death-sound: entity.iron_golem.death
      particle: SMOKE
      particle-count: 2
    bossbar:
      enabled: true
      title: "<gold><bold>Guardián Minero"
      color: YELLOW
      style: SEGMENTED_10
      range: 48.0
    skills-enabled: true
    # Habilidades base (fase 1, siempre activas)
    skills:
      - skill: sig_rending_charge
        enabled: true
      - skill: sig_quake
        enabled: true
        cooldown: 18.0
      - skill: sig_dust_cloud
        enabled: true
      - skill: sig_spawn_roar
        enabled: true
      - skill: sig_death_burst
        enabled: true
    phases:
      - health-percent: 66
        name: "Fase 2 - Derrumbe"
        message: "<gold>¡El techo tiembla! <gray>El Guardián se enfurece."
        sound: entity.iron_golem.damage
        animation: attack
        speed-multiplier: 1.2
        damage-multiplier: 1.25
        replace-base-skills: false
        heal-fraction: 0.0
        skills:
          - skill: sig_mine_collapse
            enabled: true
          - skill: sig_stone_skin
            enabled: true
          - skill: sig_earth_spikes
            enabled: true
      - health-percent: 33
        name: "Fase 3 - Dinamita"
        message: "<red><bold>¡Dinamita! <gray>El Guardián lo arriesga todo."
        sound: entity.wither.spawn
        animation: ""
        speed-multiplier: 1.4
        damage-multiplier: 1.6
        replace-base-skills: false
        heal-fraction: 0.1
        skills:
          - skill: sig_mine_dynamite
            enabled: true
          - skill: sig_blood_frenzy
            enabled: true
          - skill: sig_skeleton_guard
            enabled: true
    spawn-rules:
      0:
        dimension: minas
        mode: ADDITIVE
        chance: 0.5
        min-y: -60
        max-y: 20
        biomes: []
        group-min: 1
        group-max: 1
        max-per-chunk: 1
