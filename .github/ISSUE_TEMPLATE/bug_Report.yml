name: Reportar un fallo
description: Algo no funciona como debería
labels: [bug]
body:
  - type: input
    id: paper
    attributes:
      label: Versión de Paper
      placeholder: "Paper 1.21.1 build 130"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Versión de DimensionForge
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [Dimensiones, Portales, Menas, Mobs y jefes, Habilidades, Resource pack, BetterModel, Menús, Otro]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log / error de consola
      render: text
