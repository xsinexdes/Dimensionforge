# ============================================================
#  DimensionForge - config.yml
#  Los textos van en messages.yml. Aquí solo la mecánica.
# ============================================================

gui:
  # CHAT = escribes el valor en el chat. ANVIL = se abre un yunque para escribirlo.
  input-mode: CHAT
  input-timeout-seconds: 60

dimensions:
  # Mundo (carga previa) al que se evacua a los jugadores cuando se descarga/borra una dimensión.
  # Vacío = el primer mundo del servidor.
  safe-world: ""
  # Carpetas que NO aparecen en el menú de importar.
  import-blacklist:
    - plugins
    - logs
    - crash-reports
    - libraries
    - cache
    - versions
    - config
    - world_the_end_backup
  # Si una dimensión de tipo VOID genera una plataforma de piedra en el spawn.
  void-platform: true

# Hacha de portales
wand:
  material: GOLDEN_AXE
  name: "<light_purple><bold>Hacha de Portales"
  lore:
    - "<gray>Clic izquierdo: <white>posición 1"
    - "<gray>Clic derecho: <white>posición 2"
    - "<gray>Agacharte + clic: <white>borrar selección"
  custom-model-data: 0
  particle: DUST
  color: "#FF55FF"

portals:
  default-cooldown-seconds: 3
  default-sound: entity.enderman.teleport
  # Volumen máximo (bloques) de una región de portal
  max-fill-volume: 4096
  # Bloques colocados por tick al rellenar un portal
  fill-blocks-per-tick: 600
  # true = solo reemplaza aire al rellenar
  fill-only-air: true
  # Protege el relleno contra romper/explotar
  protect-fill: true
  # Segundos de gracia tras llegar (evita rebotar en el portal de vuelta)
  arrival-grace-seconds: 2
  # Al crear un portal de vuelta automático, limpia el espacio de llegada
  return-clear-space: true

ores:
  # Genera las menas (una vez por chunk) en chunks que ya existían al cargarlos: mapas de WorldPainter, mundos importados
  lazy-generation: true
  # Las dimensiones que crees con el asistente ya llevan todas las menas activadas
  auto-enable-new-dimensions: true
  # Rango de cada nivel de herramienta (mayor = mejor)
  tier-rank:
    WOOD: 0
    GOLD: 0
    STONE: 1
    IRON: 2
    DIAMOND: 3
    NETHERITE: 4
  # Multiplicador de velocidad base por material de herramienta
  tier-speed:
    WOOD: 1.0
    STONE: 1.4
    IRON: 1.8
    GOLD: 2.6
    DIAMOND: 2.2
    NETHERITE: 2.5
  efficiency-factor: 0.15
  haste-per-level: 0.2
  water-multiplier: 0.2
  air-multiplier: 0.2
  # Tiempo mínimo para romper una mena (segundos)
  min-seconds: 0.05
  swing-timeout-ticks: 8
  progress-decay-per-tick: 0.05
  # VANILLA o LINEAR (fórmula de la suerte)
  fortune-formula: VANILLA
  # Límites de rendimiento
  displays-per-tick: 20
  respawns-per-second: 40
  display-scale: 1.002

global:
  respect-worldguard: true
  skills-no-block-damage: true
  skills-skip-creative-spectator: true

models:
  # Usa BetterModel si está instalado. false = siempre el modelo simple (bloque/armor stand).
  enabled: true

pack:
  enabled: true
  build-on-start: true
  # 1.21.1 = 34. (1.21.4 = 46)
  pack-format: 34
  # legacy = models/item/<material>.json con overrides (1.21.1). items = items/*.json (1.21.4+)
  format-mode: legacy
  base-material: PAPER
  # Primer custom_model_data asignado automáticamente
  cmd-start: 100000
  host:
    # INTERNAL = servidor HTTP del propio plugin. EXTERNAL = tú subes el zip y pones la URL.
    mode: INTERNAL
    bind: 0.0.0.0
    port: 8765
    # IP o dominio que ven los jugadores (obligatorio en INTERNAL si no es autodetectable)
    public-address: ""
    external-url: ""
  bettermodel:
    # NONE o SEPARATE (ver README)
    mode: NONE
    file: ""
  send-on-join: true
  send-on-dimension: false
  force: false

skills:
  max-particles-per-tick: 600
  max-actions-per-tick: 120
  max-temp-blocks: 2000
  max-summons-per-mob: 12
  # Cada cuántos ticks se evalúan los disparadores
  trigger-period-ticks: 10
