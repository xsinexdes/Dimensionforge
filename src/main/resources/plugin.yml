name: DimensionForge
main: me.dimensionforge.DimensionForgePlugin
version: ${project.version}
api-version: "1.21"
description: Crea y edita dimensiones, portales, menas, mobs y jefes con GUI.
authors: [DimensionForge]
softdepend: [BetterModel, WorldGuard, Vault]
commands:
  dimension:
    description: Comando principal de DimensionForge
    aliases: [dim, dforge]
    usage: /dimension help
permissions:
  dimensionforge.admin:
    description: Acceso total a menús y subcomandos de administración
    default: op
  dimensionforge.tp:
    description: Permite teletransportarse con /dimension tp
    default: op
  dimensionforge.bypass:
    description: Ignora los permisos de dimensiones y portales
    default: op
