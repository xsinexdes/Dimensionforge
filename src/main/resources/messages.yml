  import-title: "<dark_purple>Importar mundo"
  picker-title: "<dark_purple>Elegir dimensión"
  portals-title: "<dark_purple>Portales"
  ores-title: "<dark_purple>Menas custom"
  drops-title: "<dark_purple>Drops"
  mobs-title: "<dark_purple>Mobs custom"
