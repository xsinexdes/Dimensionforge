    - " <white>/dimension ore <menu|list|create|set|info|remove|enable|disable|scan|regen> <gray>- menas"
    - " <white>/dimension mob <menu|list|create|spawn|remove|info|model|refresh> <gray>- mobs"
    - " <white>/dimension skill <library|count|list|info|regen|test> <gray>- habilidades"
    - " <white>/dimension pack <menu|build|send|status|validate> <gray>- resource pack"
    - " <white>/dimension reload <gray>- recargar"

