# ============================================================
#  DimensionForge - messages.yml  (MiniMessage)
#  {prefix} se sustituye por la clave "prefix". Los {valores} los pone el plugin.
# ============================================================
prefix: "<gradient:#8a5cff:#3fd0ff><bold>DimensionForge</bold></gradient> <dark_gray>»</dark_gray> "

error:
  generic: "{prefix}<red>Ha ocurrido un error: <white>{error}"
  not-number: "{prefix}<red>«{value}» no es un número válido."
  empty-hand: "{prefix}<red>Debes tener un ítem en la mano."
  invalid-material: "{prefix}<red>Material desconocido: <white>{value}"
  dimension-name-invalid: "{prefix}<red>Nombre no válido. Usa letras, números, guion y guion bajo."
  dimension-name-exists: "{prefix}<red>Ya existe una dimensión con ese nombre."
  dimension-folder-exists: "{prefix}<red>Ya existe una carpeta de mundo con ese nombre."
  portal-id-invalid: "{prefix}<red>ID de portal no válido (letras minúsculas, números, guion y guion bajo)."
  portal-id-exists: "{prefix}<red>Ya existe un portal con ese ID."
  ore-id-invalid: "{prefix}<red>ID de mena no válido o ya existente."
  mob-id-invalid: "{prefix}<red>ID de mob no válido o ya existente: <white>{id}"
  mob-type-invalid: "{prefix}<red>Tipo de entidad no válido o no spawneable: <white>{value}"

input:
  chat-prompt: "{prefix}<yellow>{prompt} <gray>(escribe en el chat, o <white>cancelar</white> para salir)"
  cancelled: "{prefix}<gray>Entrada cancelada."
